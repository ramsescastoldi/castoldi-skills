<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>@eusouramses · Estratégia</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { margin: 0; padding: 0; background: #1a1a1a; display: flex; align-items: center; justify-content: center; min-height: 100vh; font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
  .card { width: 1080px; height: 1350px; background: #0a0a0a; position: relative; display: flex; flex-direction: column; padding: 70px 90px; box-shadow: 0 20px 80px rgba(0, 0, 0, 0.5); }
  .header { display: flex; align-items: center; gap: 32px; padding-bottom: 0; }
  .avatar-wrapper { width: 130px; height: 130px; border-radius: 50%; background: conic-gradient(from 45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #f09433 100%); padding: 5px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .avatar-inner { width: 100%; height: 100%; border-radius: 50%; background: #0a0a0a; padding: 3px; display: flex; align-items: center; justify-content: center; }
  .avatar-photo { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; object-position: center top; }
  .name-block { display: flex; flex-direction: column; gap: 4px; }
  .name { color: #f4f0e6; font-size: 38px; font-weight: 800; letter-spacing: -0.5px; line-height: 1.1; display: flex; align-items: center; gap: 10px; }
  .verified { display: inline-block; width: 28px; height: 28px; background: #1d9bf0; border-radius: 50%; position: relative; vertical-align: middle; flex-shrink: 0; }
  .verified::after { content: '✓'; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #fff; font-size: 16px; font-weight: bold; }
  .handle { color: #8a8a8a; font-size: 28px; font-weight: 500; letter-spacing: -0.3px; }
  .quote-area { flex: 1; display: flex; align-items: center; justify-content: flex-start; padding: 30px 0; }
  .quote { color: #f4f0e6; font-weight: 700; letter-spacing: -1.5px; line-height: 1.18; text-align: left; }
  .quote-sm { font-size: 124px; line-height: 1.10; }
  .quote-md { font-size: 104px; line-height: 1.15; }
  .quote-lg { font-size: 88px;  line-height: 1.20; }
  .quote-xl { font-size: 72px;  line-height: 1.22; }
  .red { color: #e63946; font-weight: 900; }
  .gold { color: #d4a04a; font-weight: 800; }
  em { font-style: italic; font-weight: 700; }
  .footer { border-top: 1px solid rgba(244, 240, 230, 0.12); padding-top: 36px; display: flex; justify-content: space-between; align-items: center; }
  .footer-handle { color: #8a8a8a; font-size: 24px; font-weight: 600; letter-spacing: -0.3px; }
  .footer-mark { color: #8a8a8a; font-size: 22px; font-weight: 600; letter-spacing: 3px; }
</style>
</head>
